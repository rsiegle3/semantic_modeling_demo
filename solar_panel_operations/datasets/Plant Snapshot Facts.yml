unique_name: "Plant Snapshot Facts"
object_type: "dataset"
label: "Plant Snapshot Facts"
connection_id: "bird_solar_panel"
sql: "SELECT\n  pr.snapkey AS snapkey,\n  pr.sitetie AS site_key,\n  pr.snapts AS snapshot_ts,\n  pr.snapts::date AS snapshot_date,\n  extract(year from pr.snapts)::int AS snapshot_year,\n  extract(quarter from pr.snapts)::int AS snapshot_quarter_num,\n  'Q' || extract(quarter from pr.snapts)::int AS snapshot_quarter_name,\n  extract(month from pr.snapts)::int AS snapshot_month_num,\n  trim(to_char(pr.snapts, 'Month')) AS snapshot_month_name,\n  1 AS snapshot_count,\n  substring(replace(ep.elec_perf_snapshot #>> '{grid,grid_voltage_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS grid_voltage_v,\n  substring(replace(ep.elec_perf_snapshot #>> '{grid,grid_frequency_hz}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS grid_frequency_hz,\n  substring(replace(ep.elec_perf_snapshot #>> '{grid,power_quality_idx}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_quality_idx,\n  substring(replace(ep.elec_perf_snapshot #>> '{grid,reactive_power_var}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS reactive_power_var,\n  substring(replace(ep.elec_perf_snapshot #>> '{grid,harmonic_distortion_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS harmonic_distortion_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{power,power_now_w}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_now_w,\n  substring(replace(ep.elec_perf_snapshot #>> '{power,power_loss_w}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_loss_w,\n  substring(replace(ep.elec_perf_snapshot #>> '{inverter,power_factor}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS power_factor,\n  substring(replace(ep.elec_perf_snapshot #>> '{inverter,inverter_temp_c}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS inverter_temp_c,\n  substring(replace(ep.elec_perf_snapshot #>> '{inverter,inverter_eff_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS inverter_eff_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,imp_now_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS imp_now_a,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,isc_now_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS isc_now_a,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,vmp_now_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS vmp_now_v,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,voc_now_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS voc_now_v,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,imp_initial_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS imp_initial_a,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,isc_initial_a}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS isc_initial_a,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,vmp_initial_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS vmp_initial_v,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,voc_initial_v}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS voc_initial_v,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,shunt_res_ohm}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS shunt_res_ohm,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,series_res_ohm}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS series_res_ohm,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,fill_factor_now}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS fill_factor_now,\n  substring(replace(ep.elec_perf_snapshot #>> '{iv_curve,fill_factor_initial}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS fill_factor_initial,\n  substring(replace(ep.elec_perf_snapshot #>> '{efficiency,eff_loss_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS eff_loss_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{efficiency,soil_loss_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS soil_loss_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{efficiency,instant_eff_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS instant_eff_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{efficiency,spectral_mismatch}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS spectral_mismatch_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{efficiency,cumulative_deg_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cumulative_deg_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{energy_yield,availability_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS availability_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{energy_yield,energy_yield_kwh}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS energy_yield_kwh,\n  substring(replace(ep.elec_perf_snapshot #>> '{energy_yield,performance_ratio}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS performance_ratio,\n  substring(replace(ep.elec_perf_snapshot #>> '{energy_yield,capacity_factor_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS capacity_factor_pct,\n  substring(replace(ep.elec_perf_snapshot #>> '{energy_yield,specific_yield_kwh_kw}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS specific_yield_kwh_kw,\n  substring(replace(ev.env_snapshot #>> '{irradiance,dni_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS dni_w_m2,\n  substring(replace(ev.env_snapshot #>> '{irradiance,ghi_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS ghi_w_m2,\n  substring(replace(ev.env_snapshot #>> '{irradiance,dhi_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS dhi_w_m2,\n  substring(replace(ev.env_snapshot #>> '{irradiance,poa_irr_w_m2}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS poa_irr_w_m2,\n  substring(replace(ev.env_snapshot #>> '{atmospheric,uv_index}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS uv_index,\n  substring(replace(ev.env_snapshot #>> '{atmospheric,cloud_cover_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cloud_cover_pct,\n  substring(replace(ev.env_snapshot #>> '{atmospheric,air_pressure_hpa}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS air_pressure_hpa,\n  substring(replace(ev.env_snapshot #>> '{atmospheric,dust_density_kg_m3}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS dust_density_kg_m3,\n  substring(replace(ev.env_snapshot #>> '{atmospheric,relative_humidity_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS relative_humidity_pct,\n  substring(replace(ev.env_snapshot #>> '{temperatures,cell_temp_c}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cell_temp_c,\n  substring(replace(ev.env_snapshot #>> '{temperatures,ambient_temp_c}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS ambient_temp_c,\n  substring(replace(ev.env_snapshot #>> '{wind_rain_snow,rain_mm}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS rain_mm,\n  substring(replace(ev.env_snapshot #>> '{wind_rain_snow,snow_cover_pct}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS snow_cover_pct,\n  substring(replace(ev.env_snapshot #>> '{wind_rain_snow,wind_speed_m_s}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS wind_speed_m_s,\n  substring(replace(mc.mech_health_snapshot #>> '{module_surface,hotspot_count}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS hotspot_count,\n  substring(replace(mc.mech_health_snapshot #>> '{module_surface,microcrack_count}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS microcrack_count,\n  substring(replace(mc.mech_health_snapshot #>> '{mount_cleaning,cleaning_cycle_days}', ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS cleaning_cycle_days,\n  nullif(mc.mech_health_snapshot #>> '{mount_cleaning,last_clean_date}', '')::date AS last_clean_date,\n  mc.mech_health_snapshot #>> '{tracker,tracker_state}' AS tracker_state,\n  mc.mech_health_snapshot #>> '{module_surface,lid_status}' AS lid_status,\n  mc.mech_health_snapshot #>> '{module_surface,pid_severity}' AS pid_severity,\n  mc.mech_health_snapshot #>> '{module_surface,glass_condition}' AS glass_condition,\n  mc.mech_health_snapshot #>> '{module_surface,busbar_corrosion}' AS busbar_corrosion,\n  mc.mech_health_snapshot #>> '{module_surface,backsheet_condition}' AS backsheet_condition,\n  mc.mech_health_snapshot #>> '{module_surface,delamination_status}' AS delamination_status,\n  mc.mech_health_snapshot #>> '{module_surface,snail_trail_severity}' AS snail_trail_severity,\n  mc.mech_health_snapshot #>> '{module_surface,encapsulant_yellowing}' AS encapsulant_yellowing,\n  mc.mech_health_snapshot #>> '{mount_cleaning,mount_structure_status}' AS mount_structure_status,\n  mc.mech_health_snapshot #>> '{electrical_integrity,cable_condition}' AS cable_condition,\n  mc.mech_health_snapshot #>> '{electrical_integrity,grounding_status}' AS grounding_status,\n  mc.mech_health_snapshot #>> '{electrical_integrity,bypass_diode_status}' AS bypass_diode_status,\n  mc.mech_health_snapshot #>> '{electrical_integrity,connector_condition}' AS connector_condition,\n  mc.mech_health_snapshot #>> '{electrical_integrity,junction_box_condition}' AS junction_box_condition,\n  om.mtbfh::float8 AS mtbf_hours,\n  om.mttrh::float8 AS mttr_hours,\n  om.maintcost::float8 AS maintenance_cost,\n  om.cleancost::float8 AS cleaning_cost,\n  om.replcost::float8 AS replacement_cost,\n  substring(replace(om.revloss, ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS revenue_loss,\n  nullif(trim(om.optpot), '') AS optimization_potential,\n  nullif(trim(al.alrtstate), '') AS alert_state,\n  substring(replace(al.alrtcnt, ',', '') from '-?[0-9]+\\.?[0-9]*')::float8 AS alert_event_count,\n  nullif(trim(al.maintprio), '') AS maintenance_priority,\n  nullif(trim(al.replprio), '') AS replacement_priority\nFROM public.plant_record pr\nLEFT JOIN public.electrical_performance ep ON ep.snaplink = pr.snapkey\nLEFT JOIN public.environmental_conditions ev ON ev.snapref = pr.snapkey\nLEFT JOIN public.mechanical_condition mc ON mc.snapmk = pr.snapkey\nLEFT JOIN public.operational_metrics om ON om.snapops = pr.snapkey\nLEFT JOIN public.alert al ON al.snapalrt = pr.snapkey"
