unique_name: "Mounting and Electrical Condition"
object_type: "dimension"
label: "Mounting and Electrical Condition"
type: "standard"
is_degenerate: true
level_attributes:
  - unique_name: "Tracker State"
    label: "Tracker State"
    description: "Solar tracker operating state in the snapshot, e.g. Normal, Maintenance or Error."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "tracker_state"
    name_column: "tracker_state"
  - unique_name: "Mount Structure Status"
    label: "Mount Structure Status"
    description: "Mounting structure status in the snapshot, e.g. Stable, Unstable or Check Required."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "mount_structure_status"
    name_column: "mount_structure_status"
  - unique_name: "Last Clean Date"
    label: "Last Clean Date"
    description: "Date the plant arrays were last cleaned as of the snapshot (cleaning history). Not the Snapshot Day."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "last_clean_date"
    name_column: "last_clean_date"
  - unique_name: "Cable Condition"
    label: "Cable Condition"
    description: "DC cable condition in the snapshot, e.g. Good or Fair."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "cable_condition"
    name_column: "cable_condition"
  - unique_name: "Grounding Status"
    label: "Grounding Status"
    description: "Electrical grounding status in the snapshot, e.g. Normal, Check Required or Failed."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "grounding_status"
    name_column: "grounding_status"
  - unique_name: "Bypass Diode Status"
    label: "Bypass Diode Status"
    description: "Bypass diode status in the snapshot, e.g. Normal or Partial."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "bypass_diode_status"
    name_column: "bypass_diode_status"
  - unique_name: "Connector Condition"
    label: "Connector Condition"
    description: "Connector condition in the snapshot, e.g. Fair or Poor."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "connector_condition"
    name_column: "connector_condition"
  - unique_name: "Junction Box Condition"
    label: "Junction Box Condition"
    description: "Junction box condition in the snapshot, e.g. Good or Fair."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "junction_box_condition"
    name_column: "junction_box_condition"
hierarchies:
  - unique_name: "Tracker State Hierarchy"
    label: "Tracker State"
    filter_empty: "yes"
    folder: "Mounting and Electrical Condition"
    levels:
      - unique_name: "Tracker State"
