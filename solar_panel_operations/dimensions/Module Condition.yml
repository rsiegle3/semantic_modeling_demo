unique_name: "Module Condition"
object_type: "dimension"
label: "Module Condition"
type: "standard"
is_degenerate: true
level_attributes:
  - unique_name: "LID Status"
    label: "LID Status"
    description: "Light-induced degradation (LID) status of the modules in the snapshot, e.g. Stabilized or Unknown."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "lid_status"
    name_column: "lid_status"
  - unique_name: "PID Severity"
    label: "PID Severity"
    description: "Potential-induced degradation (PID) severity of the modules in the snapshot, e.g. Low. Blank when not assessed."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "pid_severity"
    name_column: "pid_severity"
  - unique_name: "Glass Condition"
    label: "Glass Condition"
    description: "Module front glass condition in the snapshot, e.g. Clear or Damaged."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "glass_condition"
    name_column: "glass_condition"
  - unique_name: "Busbar Corrosion"
    label: "Busbar Corrosion"
    description: "Module busbar corrosion level in the snapshot, e.g. Visible or Severe."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "busbar_corrosion"
    name_column: "busbar_corrosion"
  - unique_name: "Backsheet Condition"
    label: "Backsheet Condition"
    description: "Module backsheet condition in the snapshot, e.g. Good, Fair or Poor."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "backsheet_condition"
    name_column: "backsheet_condition"
  - unique_name: "Delamination Status"
    label: "Delamination Status"
    description: "Module delamination level in the snapshot, e.g. Minor or Major."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "delamination_status"
    name_column: "delamination_status"
  - unique_name: "Snail Trail Severity"
    label: "Snail Trail Severity"
    description: "Snail trail (cell discoloration lines) severity on modules in the snapshot, e.g. Light."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "snail_trail_severity"
    name_column: "snail_trail_severity"
  - unique_name: "Encapsulant Yellowing"
    label: "Encapsulant Yellowing"
    description: "Module encapsulant yellowing level in the snapshot, e.g. Severe. Blank when not assessed."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "encapsulant_yellowing"
    name_column: "encapsulant_yellowing"
