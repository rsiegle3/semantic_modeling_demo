unique_name: "Snapshot Date"
object_type: "dimension"
label: "Snapshot Date"
type: "time"
is_degenerate: true
level_attributes:
  - unique_name: "Snapshot Year"
    label: "Snapshot Year"
    description: "Calendar year of the plant performance snapshot (snapshot year, reading year). Not the plant go-live year."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "snapshot_year"
    name_column: "snapshot_year"
    time_unit: "year"
  - unique_name: "Snapshot Quarter"
    label: "Snapshot Quarter"
    description: "Calendar quarter (Q1 to Q4) within the snapshot year of the plant performance snapshot."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "snapshot_year"
      - "snapshot_quarter_num"
    name_column: "snapshot_quarter_name"
    time_unit: "quarter"
  - unique_name: "Snapshot Month"
    label: "Snapshot Month"
    description: "Calendar month (January to December) within the snapshot year and quarter of the plant performance snapshot."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "snapshot_year"
      - "snapshot_quarter_num"
      - "snapshot_month_num"
    name_column: "snapshot_month_name"
    time_unit: "month"
  - unique_name: "Snapshot Day"
    label: "Snapshot Day"
    description: "Calendar day the plant performance snapshot was taken (snapshot date, reading date, yyyy-mm-dd). Not the last clean date or go-live date."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "snapshot_date"
    name_column: "snapshot_date"
    time_unit: "day"
hierarchies:
  - unique_name: "Snapshot Date Hierarchy"
    label: "Snapshot Date"
    filter_empty: "yes"
    folder: "Snapshot Date"
    levels:
      - unique_name: "Snapshot Year"
      - unique_name: "Snapshot Quarter"
      - unique_name: "Snapshot Month"
      - unique_name: "Snapshot Day"
