unique_name: "Alert Status"
object_type: "dimension"
label: "Alert Status"
type: "standard"
is_degenerate: true
level_attributes:
  - unique_name: "Alert State"
    label: "Alert State"
    description: "Alarm state of the plant snapshot, e.g. Warning or Critical; blank when no alert state was recorded. See also Maintenance Priority and Replacement Priority."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "alert_state"
    name_column: "alert_state"
  - unique_name: "Maintenance Priority"
    label: "Maintenance Priority"
    description: "How urgently the snapshot calls for maintenance: Low, Medium or High. Not the Replacement Priority."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "maintenance_priority"
    name_column: "maintenance_priority"
  - unique_name: "Replacement Priority"
    label: "Replacement Priority"
    description: "How urgently the snapshot calls for equipment replacement: Low, Medium or High. Not the Maintenance Priority."
    dataset: "Plant Snapshot Facts"
    key_columns:
      - "replacement_priority"
    name_column: "replacement_priority"
hierarchies:
  - unique_name: "Alert State Hierarchy"
    label: "Alert State"
    filter_empty: "yes"
    folder: "Alert Status"
    levels:
      - unique_name: "Alert State"
  - unique_name: "Maintenance Priority Hierarchy"
    label: "Maintenance Priority"
    filter_empty: "yes"
    folder: "Alert Status"
    levels:
      - unique_name: "Maintenance Priority"
  - unique_name: "Replacement Priority Hierarchy"
    label: "Replacement Priority"
    filter_empty: "yes"
    folder: "Alert Status"
    levels:
      - unique_name: "Replacement Priority"
