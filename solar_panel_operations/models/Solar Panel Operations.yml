unique_name: "Solar Panel Operations"
object_type: "model"
label: "Solar Panel Operations"
description: "Solar plant fleet operations. One row per plant performance snapshot (998 snapshots across about 937 plants). Slice by Plant (site attributes such as warranty, insurance, compliance and environmental risk), Panel Model (manufacturer, technology, rated power), Snapshot Date (year, quarter, month, day), alert state and priorities, module and mounting condition, and optimization potential. Metrics cover energy yield and power output and loss, efficiency and degradation, availability, grid and inverter readings, IV curve, weather, module defects, reliability (MTBF, MTTR), maintenance, cleaning and replacement cost, revenue loss and alert events."
ai_context:
  - source_type: "warehouse"
    source: "Postgres connection bird_solar_panel, database solar_panel, schema public (tables plant_record, plants, panel_models, electrical_performance, environmental_conditions, mechanical_condition, operational_metrics, alert)"
    instruction: "Grain is plant_record (one row per snapshot, PK snapkey). The five 1:1 snapshot tables are LEFT JOINed on snapkey in the derived dataset Plant Snapshot Facts, which extracts JSON fields with #>> and converts text-typed numbers (revloss, alrtcnt, spectral_mismatch, series_res_ohm) by regex. Plants and panel_models are physical dimension datasets joined by plant_record.sitetie and plants.modhook. No catalog or reference model was available."
  - source_type: "warehouse"
    source: "tables inspection and plant_panel_model"
    instruction: "Deliberately not modeled. inspection has no key linking it to a plant or snapshot (PK is inspectmode only). plant_panel_model is a plant-to-panel-model bridge; the model uses plants.modhook for one panel model per plant."
dimensions:
  - "Snapshot Date"
  - "Alert Status"
  - "Optimization Potential"
  - "Module Condition"
  - "Mounting and Electrical Condition"
